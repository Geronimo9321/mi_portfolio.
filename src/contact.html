<main>

    <!-- REDES -->
    <section id="social-media-section" class="redesSocial">
        <h2>Podés contactarme directamente por:</h2>

        <div class="social-item">
            <img src="../img/logo-whatsapp.jfif" class="social-icon">
            <a href="https://wa.me/543624634255">WhatsApp</a>
        </div>

        <div class="social-item">
            <img src="../img/logo-linkedin.png" class="social-icon">
            <a href="https://www.linkedin.com/in/geronimo-ariel-franco-programador-tester">LinkedIn</a>
        </div>

        <div class="social-item">
            <img src="../img/logo-gmail.png" class="social-icon">
            <a href="mailto:geronimoarielfranco028@gmail.com">Email</a>
        </div>

        <div class="social-item">
            <img src="../img/logo-github.jpg" class="social-icon">
            <a href="https://github.com/Geronimo9321">GitHub</a>
        </div>
    </section>

    <!-- FORMULARIO -->
    <section id="contacto" class="contacto">
        <h2>O enviame un mensaje</h2>

        <form id="form">
            <input type="text" name="name" placeholder="Nombre" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Mensaje" required></textarea>
            <button type="submit">Enviar</button>
        </form>

        <p id="status"></p>
    </section>
